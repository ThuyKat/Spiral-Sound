name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/frontend-react

      - name: Lint
        run: npm run lint
        working-directory: frontend/frontend-react

      - name: Build
        run: npm run build
        working-directory: frontend/frontend-react

  backend:
    name: Backend — Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Check syntax
        run: node --check server.js
        working-directory: backend
